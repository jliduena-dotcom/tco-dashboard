name: Generar Dashboard TCO

on:
  push:
    paths:
      - "data/*.xls"
      - "data/*.xlsx"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install pandas xlrd openpyxl

      - name: Generar dashboard HTML
        run: python scripts/generar_dashboard.py

      - name: Crear .nojekyll
        run: touch docs/.nojekyll

      - name: Subir HTML generado
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Dashboard actualizado"
          file_pattern: "docs/index.html docs/.nojekyll"
